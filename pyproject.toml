[project]
name = "assetlint"
version = "0.1.0.dev0"
description = "A headless linter for 3D asset folders: naming, budgets and formats, checked in CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "kartik" }]
keywords = ["lint", "3d", "assets", "gamedev", "gltf", "blender", "pipeline", "ci"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pillow>=10.4",
    "pydantic>=2.7",
    "rich>=13.7",
    "send2trash>=1.8",
    "tomlkit>=0.13",
    "typer>=0.12",
]

[project.scripts]
assetlint = "assetlint.cli:app"

[project.optional-dependencies]
app = [
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetlint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
