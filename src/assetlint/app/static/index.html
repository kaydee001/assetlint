<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset Lint</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/static/icon.svg" alt="" width="20" height="20" />
        <span>Asset Lint</span>
      </div>
      <form class="folder" id="folder-form" autocomplete="off">
        <label class="visually-hidden" for="folder">Asset folder</label>
        <input id="folder" name="folder" list="recent" spellcheck="false"
               placeholder="Paste a folder path, e.g. D:\game\assets" />
        <datalist id="recent"></datalist>
        <button type="button" id="browse" class="secondary" hidden>Browse…</button>
        <button type="submit" id="check">Check</button>
      </form>
      <nav class="tabs" id="tabs" aria-label="View" hidden>
        <button type="button" data-view="problems" aria-pressed="true">Problems</button>
        <button type="button" data-view="rules" aria-pressed="false">Rules</button>
      </nav>
    </header>

    <main class="rules-page" id="rules-page" hidden></main>
    <div class="save-error" id="save-error" role="alert" hidden></div>
    <div class="savebar" id="savebar" hidden>
      <span id="savebar-text">Unsaved changes</span>
      <button type="button" class="secondary" id="discard">Discard</button>
      <button type="button" id="save">Save and check</button>
    </div>

    <main class="layout">
      <aside class="sidebar" id="sidebar" hidden>
        <section class="summary" id="summary"></section>
        <section id="severity-section">
          <h2>Severity</h2>
          <div class="toggles" id="severity-filters"></div>
        </section>
        <section>
          <h2>By rule</h2>
          <ul class="rule-list" id="rule-filters"></ul>
        </section>
        <p class="config" id="config"></p>
      </aside>

      <section class="results" id="results">
        <div class="empty welcome" id="welcome">
          <h1>Check an asset folder</h1>
          <p>Finds bad names, oversized files and textures, triangle budgets, duplicates and broken
            texture paths, by your team's rules.</p>
          <h2 class="recent-heading" id="recent-heading" hidden>Recent</h2>
          <ul class="recent-list" id="recent-list"></ul>
        </div>
      </section>
    </main>

    <dialog class="fix-dialog" id="fix-dialog" aria-label="Fix a file"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js"></script>
    <script src="/static/rules.js"></script>
    <script src="/static/fixes.js"></script>
  </body>
</html>
