<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset Lint</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="shell">
      <!-- The rail: the three places in the app. Rules sits at the bottom, like settings. -->
      <nav class="rail" aria-label="Asset Lint">
        <div class="brand">
          <img src="/static/icon.svg" alt="" width="22" height="22" />
          <span>Asset Lint</span>
        </div>
        <button type="button" class="rail-item" data-view="overview" aria-pressed="true"
                title="Overview: how healthy the folder is and what to do next">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2.25" y="2.25" width="5" height="5" rx="1" /><rect x="8.75" y="2.25" width="5" height="5" rx="1" />
            <rect x="2.25" y="8.75" width="5" height="5" rx="1" /><rect x="8.75" y="8.75" width="5" height="5" rx="1" />
          </svg>
          <span>Overview</span>
        </button>
        <button type="button" class="rail-item" data-view="problems" aria-pressed="false"
                title="Problems: every problem, grouped by check, with how to fix it">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 4.5h7.5M6 8h7.5M6 11.5h7.5" />
            <path d="M2.5 4.5h.01M2.5 8h.01M2.5 11.5h.01" />
          </svg>
          <span>Problems</span>
          <span class="badge" id="problems-count" hidden></span>
        </button>
        <button type="button" class="rail-item bottom" data-view="rules" aria-pressed="false"
                title="Rules: what this folder is checked against">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" />
            <circle cx="10" cy="4.5" r="1.5" /><circle cx="6" cy="11.5" r="1.5" />
          </svg>
          <span>Rules</span>
        </button>
      </nav>

      <!-- The column: the folder bar on top of every screen, then that screen. -->
      <div class="main">
        <header class="head">
          <form class="folder" id="folder-form" autocomplete="off">
            <label class="visually-hidden" for="folder">Asset folder</label>
            <input id="folder" name="folder" list="recent" spellcheck="false"
                   placeholder="Paste a folder path, e.g. D:\game\assets" />
            <datalist id="recent"></datalist>
            <button type="button" id="browse" class="secondary" hidden>Browse…</button>
            <button type="submit" id="check" title="Check this folder (F5 checks it again)">Check</button>
          </form>
        </header>

        <main class="page" id="overview-page"></main>
        <main class="page" id="problems-page" hidden></main>
        <main class="page rules-page" id="rules-page" hidden></main>
      </div>
    </div>

    <div class="save-error" id="save-error" role="alert" hidden></div>
    <div class="savebar" id="savebar" hidden>
      <span id="savebar-text">Unsaved changes</span>
      <button type="button" class="secondary" id="discard">Discard</button>
      <button type="button" id="save" title="Ctrl+S">Save and check</button>
    </div>

    <dialog class="fix-dialog" id="fix-dialog" aria-label="Fix a file"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js"></script>
    <script src="/static/rules.js"></script>
    <script src="/static/fixes.js"></script>
  </body>
</html>
